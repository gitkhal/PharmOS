<!DOCTYPE html>
<html>
<head>
    <title>PharmOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --teal: #0f766e;
            --teal2: #14b8a6;
            --teal-light: #ccfbf1;

            --blue: #3b82f6;
            --purple: #8b5cf6;
            --orange: #f59e0b;
            --red: #ef4444;
            --green: #10b981;

            --navy: #0f172a;
            --navy2: #1e293b;

            --bg: #f5f8fb;
            --surface: rgba(255,255,255,0.92);
            --border: #e2e8f0;

            --text: #172033;
            --muted: #64748b;

            --shadow: 0 8px 30px rgba(15,23,42,0.07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 90% 5%,
                    rgba(20,184,166,.09),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 15% 90%,
                    rgba(59,130,246,.06),
                    transparent 30%
                ),
                var(--bg);
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        aside {
            width: 245px;
            min-height: 100vh;

            position: fixed;
            left: 0;
            top: 0;

            padding: 25px 18px;

            background:
                linear-gradient(
                    180deg,
                    #102b3d 0%,
                    #0f172a 100%
                );

            color: white;

            box-shadow:
                8px 0 35px rgba(15,23,42,.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 4px 8px 28px;
        }

        .logo {
            width: 46px;
            height: 46px;

            border-radius: 14px;

            display: grid;
            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    #2dd4bf,
                    #0f766e
                );

            box-shadow:
                0 8px 20px rgba(20,184,166,.30);
        }

        .logo svg {
            width: 27px;
            height: 27px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .brand-sub {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .section-label {
            color: #64748b;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1.5px;

            margin: 8px 11px 10px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 13px;

            color: #cbd5e1;
            text-decoration: none;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 600;

            transition: .16s;
        }

        nav a:hover {
            background: rgba(255,255,255,.08);
            color: white;
            transform: translateX(3px);
        }

        nav svg {
            width: 19px;
            height: 19px;
            stroke-width: 1.8;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 23px;
            left: 20px;
            right: 20px;

            padding: 14px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;

            background: rgba(255,255,255,.04);
        }

        .sidebar-bottom strong {
            font-size: 12px;
        }

        .sidebar-bottom span {
            display: block;

            color: #64748b;

            font-size: 10px;
            margin-top: 4px;
        }

        /* MAIN CONTENT */

        .content {
            width: calc(100% - 245px);
            margin-left: 245px;
        }

        .topbar {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: rgba(255,255,255,.76);
            backdrop-filter: blur(14px);

            border-bottom:
                1px solid rgba(226,232,240,.8);
        }

        .topbar-title {
            font-weight: 700;
            color: #334155;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            border-radius: 20px;

            background: #ecfdf5;
            color: #047857;

            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #10b981;

            box-shadow:
                0 0 0 4px rgba(16,185,129,.12);
        }

        main {
            max-width: 1450px;
            margin: auto;
            padding: 34px 38px 50px;
        }

        h2 {
            margin: 0 0 26px;

            font-size: 30px;
            font-weight: 800;

            letter-spacing: -.8px;
        }

        h3 {
            margin-top: 32px;
            margin-bottom: 13px;

            font-size: 17px;
        }

        /* DASHBOARD CARDS */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));

            gap: 18px;

            margin-bottom: 35px;
        }

        .card {
            position: relative;

            padding: 23px;

            overflow: hidden;

            border-radius: 17px;
            border:
                1px solid rgba(226,232,240,.8);

            background: var(--surface);

            box-shadow: var(--shadow);

            transition: .18s;
        }

        .card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 14px 35px rgba(15,23,42,.11);
        }

        .card::after {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            right: -35px;
            top: -35px;

            border-radius: 50%;

            background:
                rgba(20,184,166,.10);
        }

        .card:nth-child(2)::after {
            background:
                rgba(239,68,68,.10);
        }

        .card:nth-child(3)::after {
            background:
                rgba(245,158,11,.13);
        }

        .card h3 {
            margin: 0 0 10px;

            font-size: 12px;

            text-transform: uppercase;
            letter-spacing: .9px;

            color: var(--muted);
        }

        .card p {
            margin: 0 0 15px;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .card a {
            display: inline-flex;
            align-items: center;

            padding: 7px 11px;

            border-radius: 7px;

            background: #f0fdfa;
            color: var(--teal);

            text-decoration: none;

            font-size: 12px;
            font-weight: 700;
        }

        /* TABLES */

        table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            overflow: hidden;

            border-radius: 14px;

            background: white;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        th {
            padding: 13px 16px;

            text-align: left;

            background: #f8fafc;

            color: #64748b;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .6px;
        }

        td {
            padding: 14px 16px;

            border-top:
                1px solid #eef2f7;

            font-size: 14px;
        }

        tbody tr {
            transition: .12s;
        }

        tbody tr:hover {
            background: #f8fffe;
        }

        /* STATUS BADGES */

        .critical {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 7px;

            color: #b91c1c;
            background: #fef2f2;

            font-weight: 700;
        }

        .warning {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 7px;

            color: #b45309;
            background: #fff7ed;

            font-weight: 700;
        }

        /* INPUTS */

        input,
        select {
            padding: 10px 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            background: white;

            font: inherit;

            transition: .15s;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--teal2);

            box-shadow:
                0 0 0 4px
                rgba(20,184,166,.11);
        }

        /* BUTTONS */

        button,
        .button {
            display: inline-block;

            border: none;

            padding: 10px 16px;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    var(--teal),
                    var(--teal2)
                );

            color: white;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 12px
                rgba(15,118,110,.17);

            transition: .15s;
        }

        button:hover,
        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 16px
                rgba(15,118,110,.25);
        }

        main a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 650;
        }

        main a:hover {
            color: var(--teal2);
        }

        /* DJANGO MESSAGE */

        .message {
            padding: 14px 17px;

            margin-bottom: 22px;

            border-radius: 10px;

            color: #065f46;

            background:
                linear-gradient(
                    90deg,
                    #ecfdf5,
                    #f0fdfa
                );

            border-left:
                4px solid var(--green);

            box-shadow: var(--shadow);

            font-weight: 600;
        }

        /* FORM LAYOUT */

        form p {
            max-width: 620px;

            padding: 6px 0;

            display: grid;

            grid-template-columns:
                180px 1fr;

            align-items: center;

            gap: 12px;
        }

        form p label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
        }

        form p input {
            width: 100%;
        }

        /* PAGE HEADERS */

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 24px;
        }

        .page-header h2 {
            margin: 0;
        }

        /* PANELS */

        .panel {
            background:
                rgba(255,255,255,.94);

            border:
                1px solid var(--border);

            border-radius: 16px;

            padding: 22px;

            box-shadow: var(--shadow);

            margin-bottom: 24px;
        }

        .panel-title {
            margin: 0 0 16px;

            font-size: 15px;
            font-weight: 800;
        }

        /* INVENTORY TOOLBAR */

        .toolbar {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .search-box {
            min-width: 300px;
        }

        .filter-row {
            display: flex;

            gap: 8px;

            margin-top: 14px;
        }

        .filter-chip {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 20px;

            background: #f1f5f9;
            color: #475569;

            font-size: 12px;
            font-weight: 700;
        }

        .filter-chip:hover {
            background: var(--teal-light);
            color: var(--teal);
        }

        /* SECONDARY BUTTON */

        .secondary-button {
            background: #eef2f7;
            color: #475569;
            box-shadow: none;
        }

        .secondary-button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* REMOVE BUTTON */

        .danger-button {
            background: #fff1f2;
            color: #be123c;
            box-shadow: none;
        }

        .danger-button:hover {
            background: #ffe4e6;
            color: #be123c;
        }

        /* ADD MEDICINE */

        .form-card {
            max-width: 720px;
        }

        .form-card form p {
            max-width: none;

            margin: 0;

            padding: 10px 0;

            grid-template-columns:
                170px 1fr;
        }

        .form-card input {
            min-height: 42px;
        }

        .form-actions {
            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid var(--border);
        }

        /* POS */

        .pos-search {
            display: grid;

            grid-template-columns:
                1fr 110px auto;

            gap: 10px;
        }

        .pos-search input {
            width: 100%;
        }

        .sale-total {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-top: 18px;

            padding: 18px 20px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #14b8a6
                );

            color: white;

            box-shadow:
                0 8px 20px
                rgba(15,118,110,.20);
        }

        .sale-total span {
            font-size: 13px;
            opacity: .8;
        }

        .sale-total strong {
            font-size: 28px;
        }

        .empty-state {
            padding: 30px !important;

            text-align: center !important;

            color: #94a3b8;
        }

        /* FOOTER */

        footer {
            margin-top: 45px;

            padding-top: 20px;

            border-top:
                1px solid var(--border);

            color: #94a3b8;

            font-size: 11px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {
            aside {
                width: 190px;
            }

            .content {
                width: calc(100% - 190px);
                margin-left: 190px;
            }

            main {
                padding: 25px;
            }

            .pos-search {
                grid-template-columns: 1fr;
            }

            .page-header {
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside>

        <div class="brand">

            <div class="logo">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2.2"
                    stroke-linecap="round"
                >
                    <path d="M12 5v14"/>
                    <path d="M5 12h14"/>
                </svg>

            </div>

            <div>
                <div class="brand-name">
                    PharmOS
                </div>

                <div class="brand-sub">
                    Pharmacy Management
                </div>
            </div>

        </div>


        <div class="section-label">
            Workspace
        </div>


        <nav>

            <a href="/">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                >
                    <path d="M4 13h6V4H4z"/>
                    <path d="M14 20h6v-9h-6z"/>
                    <path d="M4 20h6v-3H4z"/>
                    <path d="M14 7h6V4h-6z"/>
                </svg>

                Dashboard
            </a>


            <a href="/inventory/">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                >
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="15"
                        rx="2"
                    />

                    <path d="M3 10h18"/>
                    <path d="M8 5V3"/>
                    <path d="M16 5V3"/>
                </svg>

                Inventory
            </a>


            <a href="/inventory/add/">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    />

                    <path d="M12 8v8"/>
                    <path d="M8 12h8"/>
                </svg>

                Add Medicine
            </a>


            <a href="/pos/">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                >
                    <path
                        d="M4 4h2l2 11h9l2-7H7"
                    />

                    <circle
                        cx="10"
                        cy="19"
                        r="1"
                    />

                    <circle
                        cx="17"
                        cy="19"
                        r="1"
                    />
                </svg>

                Sales / POS
            </a>

        </nav>


        <div class="sidebar-bottom">
            <strong>
                PharmOS Sprint 1
            </strong>

            <span>
                Local pharmacy system
            </span>
        </div>

    </aside>


    <div class="content">

        <div class="topbar">

            <div class="topbar-title">
                Pharmacy Workspace
            </div>

            <div class="status">
                <span class="status-dot"></span>
                System Online
            </div>

        </div>


        <main>

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}


            {% block content %}
            {% endblock %}


            <footer>
                PharmOS • Community Pharmacy Management System
            </footer>

        </main>

    </div>

</div>

</body>
</html>
